    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                900: '#0c4a6e',
              }
            },
            keyframes: {
              wind: {
                '0%': { transform: 'translateX(-100%)', opacity: '0' },
                '20%': { opacity: '1' },
                '100%': { transform: 'translateX(400%)', opacity: '0' },
              },
              'limb-swing': {
                '0%, 100%': { transform: 'rotate(-25deg)' },
                '50%': { transform: 'rotate(25deg)' },
              },
              'limb-swing-opp': {
                '0%, 100%': { transform: 'rotate(25deg)' },
                '50%': { transform: 'rotate(-25deg)' },
              },
              'road-move': {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              'bounce-run': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-4px)' },
              },
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            },
            animation: {
              'wind-fast': 'wind 0.8s linear infinite',
              'wind-medium': 'wind 1.2s linear infinite 0.3s',
              'wind-slow': 'wind 1.5s linear infinite 0.6s',
              // Slowed down animations below
              'limb': 'limb-swing 1.2s ease-in-out infinite',
              'limb-opp': 'limb-swing-opp 1.2s ease-in-out infinite',
              'road': 'road-move 3s linear infinite',
              'bounce-run': 'bounce-run 0.6s ease-in-out infinite',
              'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
            }
          }
        }
      }
    </script>
    <style>
      :root,
      [data-theme="light"],
      html:not(.dark) {
        color-scheme: light;
        --bg-primary: #F7F9FF;
        --bg-secondary: #EDF3FF;
        --surface: #FFFFFF;
        --surface-glass: rgba(255, 255, 255, 0.72);
        --text-primary: #102A56;
        --text-secondary: #526B98;
        --text-muted: #7889A8;

      }

      .dark,
      [data-theme="dark"] {
        color-scheme: dark;
        --bg-primary: #071329;
        --bg-secondary: #0B1935;
        --surface: #102448;
        --surface-glass: rgba(20, 42, 85, 0.65);
        --text-primary: #F5F7FF;
        --text-secondary: #B8C7E8;
        --text-muted: #8294B8;
        --border-color: rgba(100, 160, 255, 0.28);
        --glass-highlight: rgba(255, 255, 255, 0.12);
        --gradient-primary: linear-gradient(135deg, #6C3BFF, #2589FF);
        --gradient-secondary: linear-gradient(135deg, #00D9B8, #00B887);
        --gradient-accent: linear-gradient(135deg, #FF4D91, #FFB547);
        --gradient-sky: linear-gradient(135deg, #39A5FF, #75DFFF);
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      .origin-top-center {
        transform-origin: top center;
        transform-box: fill-box;
      }
      /* Mobile safe area spacing */
      .safe-pb {
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }

      .glass-panel {
        background-color: var(--surface-glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--border-color);
      }

      .glass-card {
        background-color: var(--surface);
        border: 1px solid var(--border-color);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
    </style>
