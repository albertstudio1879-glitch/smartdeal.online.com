      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],

                500: '#0ea5e9',

                900: '#0c4a6e',

            keyframes: {
              wind: {
                '0%': { transform: 'translateX(-100%)', opacity: '0' },
                '20%': { opacity: '1' },
                '100%': { transform: 'translateX(400%)', opacity: '0' },
              },
              'limb-swing': {
                '0%, 100%': { transform: 'rotate(-25deg)' },
                '50%': { transform: 'rotate(25deg)' },
              },
              'limb-swing-opp': {
                '0%, 100%': { transform: 'rotate(25deg)' },
                '50%': { transform: 'rotate(-25deg)' },
              },
              'road-move': {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              'bounce-run': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-4px)' },
              },
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },

              'wishlist-heartbeat': {
                '0%, 100%': { transform: 'scale(1) translateZ(0)', filter: 'drop-shadow(0 0 2px rgba(255, 51, 136, 0.45))' },
                '14%': { transform: 'scale(1.22) translateZ(0)', filter: 'drop-shadow(0 0 14px rgba(255, 51, 136, 1)) drop-shadow(0 0 6px rgba(255, 51, 136, 0.8))' },

                '58%': { transform: 'scale(0.98) translateZ(0)', filter: 'drop-shadow(0 0 2px rgba(255, 51, 136, 0.4))' },
                '75%': { transform: 'scale(1.03) translateZ(0)', filter: 'drop-shadow(0 0 4px rgba(255, 51, 136, 0.5))' }
              },
              'wishlist-badge-bounce': {
                '0%, 100%': { transform: 'translateY(0) scale(1) translateZ(0)', boxShadow: '0 0 4px rgba(255, 51, 136, 0.5), 0 2px 4px rgba(0, 0, 0, 0.25)' },
                '50%': { transform: 'translateY(-5px) scale(1.08) translateZ(0)', boxShadow: '0 0 14px rgba(255, 51, 136, 0.95), 0 0 6px rgba(255, 85, 136, 0.8), 0 4px 8px rgba(0, 0, 0, 0.3)' }
              },
              'cart-rocking': {
                '0%, 100%': { transform: 'translate3d(0, 0, 0) rotate(0deg)', filter: 'drop-shadow(0 0 2px rgba(0, 217, 255, 0.5))' },
                '25%': { transform: 'translate3d(3px, -2px, 0) rotate(3deg)', filter: 'drop-shadow(0 0 12px rgba(0, 217, 255, 0.95)) drop-shadow(0 0 5px rgba(37, 137, 255, 0.8))' },
                '50%': { transform: 'translate3d(0, 0, 0) rotate(0deg)', filter: 'drop-shadow(0 0 3px rgba(0, 217, 255, 0.5))' },
                '75%': { transform: 'translate3d(-3px, -2px, 0) rotate(-3deg)', filter: 'drop-shadow(0 0 12px rgba(0, 217, 255, 0.95)) drop-shadow(0 0 5px rgba(37, 137, 255, 0.8))' }
              },
              'cart-badge-bounce': {
                '0%, 100%': { transform: 'translateY(0) scale(1) translateZ(0)', boxShadow: '0 0 4px rgba(0, 190, 255, 0.5), 0 2px 4px rgba(0, 0, 0, 0.25)' },
                '50%': { transform: 'translateY(-5px) scale(1.08) translateZ(0)', boxShadow: '0 0 14px rgba(0, 217, 255, 0.95), 0 0 6px rgba(37, 137, 255, 0.85), 0 4px 8px rgba(0, 0, 0, 0.3)' }
              }
            },
            animation: {
              'wind-fast': 'wind 0.8s linear infinite',
              'wind-medium': 'wind 1.2s linear infinite 0.3s',
              'wind-slow': 'wind 1.5s linear infinite 0.6s',
              // Slowed down animations below
              'limb': 'limb-swing 1.2s ease-in-out infinite',
              'limb-opp': 'limb-swing-opp 1.2s ease-in-out infinite',
              'road': 'road-move 3s linear infinite',
              'bounce-run': 'bounce-run 0.6s ease-in-out infinite',
              'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
              'wishlist-heart': 'wishlist-heartbeat 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite',
              'wishlist-badge': 'wishlist-badge-bounce 1.4s ease-in-out infinite',
              'cart-rocking': 'cart-rocking 1.8s ease-in-out infinite',
              'cart-badge': 'cart-badge-bounce 1.3s ease-in-out infinite'
            }
          }
        }
      }
    </script>
    <style>
      :root,
      [data-theme="light"],
      html:not(.dark) {
        color-scheme: light;
        --bg-primary: #F7F9FF;
        --bg-secondary: #EDF3FF;
        --surface: #FFFFFF;
        --surface-glass: rgba(255, 255, 255, 0.72);
        --text-primary: #102A56;
        --text-secondary: #526B98;
        --text-muted: #7889A8;
        --border-color: rgba(92, 137, 220, 0.22);
        --gradient-primary: linear-gradient(135deg, #6C3BFF, #2589FF);
        --gradient-secondary: linear-gradient(135deg, #00D9B8, #00B887);
        --gradient-accent: linear-gradient(135deg, #FF4D91, #FFB547);
        --gradient-sky: linear-gradient(135deg, #39A5FF, #75DFFF);

        /* Glowing Border System - Light Mode */
        --glow-cyan: #00D9FF;
        --glow-blue: #2589FF;
        --glow-purple: #6C3BFF;

        --glow-border-subtle: rgba(0, 160, 255, 0.28);
        --glow-border: rgba(0, 175, 255, 0.52);
        --glow-border-hover: rgba(0, 190, 255, 0.85);
        --glow-border-featured: rgba(0, 185, 255, 0.75);

        --glow-shadow-subtle: 0 0 6px rgba(0, 160, 255, 0.1), 0 2px 8px rgba(37, 137, 255, 0.05);
        --glow-shadow: 0 0 8px rgba(0, 175, 255, 0.16), 0 0 20px rgba(37, 137, 255, 0.1);
        --glow-shadow-hover: 0 0 12px rgba(0, 190, 255, 0.28), 0 0 26px rgba(37, 137, 255, 0.18);
        --glow-shadow-featured: 0 0 14px rgba(0, 190, 255, 0.26), 0 0 30px rgba(37, 137, 255, 0.16);
        --glow-shadow-featured-hover: 0 0 18px rgba(0, 217, 255, 0.38), 0 0 38px rgba(37, 137, 255, 0.24);
        --glow-btn-shadow: 0 0 12px rgba(37, 137, 255, 0.28), 0 0 24px rgba(108, 59, 255, 0.18);
        --glow-radius: 24px;
      }

      .dark,
      [data-theme="dark"] {
        color-scheme: dark;
        --bg-primary: #071329;
        --bg-secondary: #0B1935;
        --surface: #102448;
        --surface-glass: rgba(20, 42, 85, 0.65);
        --text-primary: #F5F7FF;
        --text-secondary: #B8C7E8;
        --text-muted: #8294B8;
        --border-color: rgba(100, 160, 255, 0.28);
        --glass-highlight: rgba(255, 255, 255, 0.12);
        --gradient-primary: linear-gradient(135deg, #6C3BFF, #2589FF);
        --gradient-secondary: linear-gradient(135deg, #00D9B8, #00B887);
        --gradient-accent: linear-gradient(135deg, #FF4D91, #FFB547);
        --gradient-sky: linear-gradient(135deg, #39A5FF, #75DFFF);

        /* Glowing Border System - Dark Mode (matching reference image) */
        --glow-cyan: #00D9FF;
        --glow-blue: #2589FF;
        --glow-purple: #6C3BFF;

        --glow-border-subtle: rgba(0, 190, 255, 0.38);
        --glow-border: rgba(0, 217, 255, 0.72);
        --glow-border-hover: rgba(0, 235, 255, 0.95);
        --glow-border-featured: rgba(0, 217, 255, 0.85);

        --glow-shadow-subtle: 0 0 8px rgba(0, 217, 255, 0.16), 0 0 16px rgba(37, 137, 255, 0.1);
        --glow-shadow: 0 0 10px rgba(0, 217, 255, 0.22), 0 0 22px rgba(37, 137, 255, 0.16);
        --glow-shadow-hover: 0 0 14px rgba(0, 235, 255, 0.38), 0 0 30px rgba(37, 137, 255, 0.28);
        --glow-shadow-featured: 0 0 16px rgba(0, 217, 255, 0.35), 0 0 36px rgba(37, 137, 255, 0.25);
        --glow-shadow-featured-hover: 0 0 22px rgba(0, 235, 255, 0.48), 0 0 44px rgba(37, 137, 255, 0.35);
        --glow-btn-shadow: 0 0 14px rgba(37, 137, 255, 0.42), 0 0 28px rgba(108, 59, 255, 0.32);
        --glow-radius: 24px;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      .origin-top-center {
        transform-origin: top center;
        transform-box: fill-box;
      }
      /* Mobile safe area spacing */
      .safe-pb {
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }

      .glass-panel {
        background-color: var(--surface-glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--border-color);
      }

      .glass-card {
        background-color: var(--surface);
        border: 1px solid var(--border-color);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      /* Reusable Glowing Border System Classes */
      .glow-card {
        border: 1px solid var(--glow-border);
        box-shadow: var(--glow-shadow);
        transition: border-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
      }
      .glow-card:hover {
        border-color: var(--glow-border-hover);
        box-shadow: var(--glow-shadow-hover);
        transform: translateY(-2px);
      }

      .glow-panel {
        border: 1px solid var(--glow-border-subtle);
        box-shadow: var(--glow-shadow-subtle);
        transition: border-color 200ms ease, box-shadow 200ms ease;
      }

      .glow-featured {
        border: 1.5px solid var(--glow-border-featured);
        box-shadow: var(--glow-shadow-featured);
        transition: border-color 260ms ease, box-shadow 260ms ease, transform 260ms ease;
      }
      .glow-featured:hover {
        box-shadow: var(--glow-shadow-featured-hover);
      }

      .glow-subtle {
        border: 1px solid var(--glow-border-subtle);
        box-shadow: var(--glow-shadow-subtle);
        transition: border-color 180ms ease, box-shadow 180ms ease;
      }
      .glow-subtle:focus-within,
      .glow-subtle:focus {
        border-color: var(--glow-border);
        box-shadow: var(--glow-shadow);
      }

      .glow-interactive {
        transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      }
      .glow-interactive:hover {
        border-color: var(--glow-border-hover);
        box-shadow: var(--glow-shadow-hover);
      }
      .glow-interactive:active {
        transform: scale(0.97);
      }

      .glow-btn-primary {
        background: var(--gradient-primary);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: var(--glow-btn-shadow);
        transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      }
      .glow-btn-primary:hover:not(:disabled) {
        filter: brightness(1.12);
        box-shadow: 0 0 16px rgba(0, 217, 255, 0.45), 0 0 32px rgba(37, 137, 255, 0.35);
      }
      .glow-btn-primary:active:not(:disabled) {
        transform: scale(0.97);
      }
      .glow-btn-primary:disabled {
        opacity: 0.5;
        box-shadow: none;
        cursor: not-allowed;
      }

      /* ============================================================
         1. Wishlist Heart Continuous Animation ❤️ (1.2s infinite loop)
         Smooth heartbeat rhythm: 1.0 -> 1.18 -> 0.95 -> 1.14 -> 1.0
         with pulsating pink neon glow
         ============================================================ */
      @keyframes wishlist-heartbeat {
        0% {
          transform: scale(1);
          filter: drop-shadow(0 0 2px rgba(255, 51, 136, 0.4));
        }
        18% {
          transform: scale(1.18);
          filter: drop-shadow(0 0 11px rgba(255, 51, 136, 0.95));
        }
        32% {
          transform: scale(0.95);
          filter: drop-shadow(0 0 3px rgba(255, 51, 136, 0.5));
        }
        50% {
          transform: scale(1.14);
          filter: drop-shadow(0 0 9px rgba(255, 51, 136, 0.85));
        }
        68% {
          transform: scale(0.97);
          filter: drop-shadow(0 0 2px rgba(255, 51, 136, 0.4));
        }
        82% {
          transform: scale(1.02);
          filter: drop-shadow(0 0 3px rgba(255, 51, 136, 0.45));
        }
      /* ============================================================
         1. Wishlist Heart Continuous Animation ❤️ (1.2s infinite loop)
         Smooth heartbeat rhythm: 1.0 -> 1.22 -> 0.95 -> 1.15 -> 1.0
         with pulsating pink neon glow
         ============================================================ */
      @keyframes wishlist-heartbeat {
        0%, 100% {
          transform: scale(1) translateZ(0);
          filter: drop-shadow(0 0 2px rgba(255, 51, 136, 0.45));
        }
        14% {
          transform: scale(1.22) translateZ(0);
          filter: drop-shadow(0 0 14px rgba(255, 51, 136, 1)) drop-shadow(0 0 6px rgba(255, 51, 136, 0.8));
        }
        28% {
          transform: scale(0.95) translateZ(0);
          filter: drop-shadow(0 0 3px rgba(255, 51, 136, 0.5));
        }
        42% {
          transform: scale(1.15) translateZ(0);
          filter: drop-shadow(0 0 10px rgba(255, 51, 136, 0.9)) drop-shadow(0 0 4px rgba(255, 51, 136, 0.6));
        }
        58% {
          transform: scale(0.98) translateZ(0);
          filter: drop-shadow(0 0 2px rgba(255, 51, 136, 0.4));
        }
        75% {
          transform: scale(1.03) translateZ(0);
          filter: drop-shadow(0 0 4px rgba(255, 51, 136, 0.5));
        }
      }

      .animate-wishlist-heart {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        transform-origin: center center !important;
        animation: wishlist-heartbeat 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite !important;
        will-change: transform, filter;
      }

      /* ============================================================
         2. Wishlist Notification Badge Bounce (1.4s infinite loop)
         Continuous 4-6px vertical bounce + scale 1.0 to 1.08
         with pulsing pink neon glow
         ============================================================ */
      @keyframes wishlist-badge-bounce {
        0%, 100% {
          transform: translateY(0) scale(1) translateZ(0);
          box-shadow: 0 0 4px rgba(255, 51, 136, 0.5), 0 2px 4px rgba(0, 0, 0, 0.25);
        }
        50% {
          transform: translateY(-5px) scale(1.08) translateZ(0);
          box-shadow: 0 0 14px rgba(255, 51, 136, 0.95), 0 0 6px rgba(255, 85, 136, 0.8), 0 4px 8px rgba(0, 0, 0, 0.3);
        }
      }

      .animate-wishlist-badge {
        display: flex !important;
        align-items: center;
        justify-content: center;
        transform-origin: center bottom !important;
        animation: wishlist-badge-bounce 1.4s ease-in-out infinite !important;
        will-change: transform, box-shadow;
      }

      /* ============================================================
         3. Shopping Cart Rolling & Rocking (1.8s infinite loop)
         Gentle rolling & rocking motion: tilt ±3°, 3px move,
         wheel spin/bounce, and smooth electric-blue glow
         ============================================================ */
      @keyframes cart-rocking {
        0%, 100% {
          transform: translate3d(0, 0, 0) rotate(0deg);
          filter: drop-shadow(0 0 2px rgba(0, 217, 255, 0.5));
        }
        25% {
          transform: translate3d(3px, -2px, 0) rotate(3deg);
          filter: drop-shadow(0 0 12px rgba(0, 217, 255, 0.95)) drop-shadow(0 0 5px rgba(37, 137, 255, 0.8));
        }
        50% {
          transform: translate3d(0, 0, 0) rotate(0deg);
          filter: drop-shadow(0 0 3px rgba(0, 217, 255, 0.5));
        }
        75% {
          transform: translate3d(-3px, -2px, 0) rotate(-3deg);
          filter: drop-shadow(0 0 12px rgba(0, 217, 255, 0.95)) drop-shadow(0 0 5px rgba(37, 137, 255, 0.8));
        }
      }

      @keyframes cart-wheel-spin {
        0%, 100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(60deg);
        }
        50% {
          transform: rotate(0deg);
        }
        75% {
          transform: rotate(-60deg);
        }
      }

      .animate-cart-rocking {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        transform-origin: center bottom !important;
        animation: cart-rocking 1.8s ease-in-out infinite !important;
        will-change: transform, filter;
      }

      .animate-cart-rocking svg circle {
        transform-origin: center center;
        transform-box: fill-box;
        animation: cart-wheel-spin 1.8s ease-in-out infinite;
      }

      /* ============================================================
         4. Cart Notification Badge Bounce (1.3s infinite loop)
         Continuous 4-6px vertical bounce + scale 1.0 to 1.08
         with soft electric-blue neon glow
         ============================================================ */
      @keyframes cart-badge-bounce {
        0%, 100% {
          transform: translateY(0) scale(1) translateZ(0);
          box-shadow: 0 0 4px rgba(0, 190, 255, 0.5), 0 2px 4px rgba(0, 0, 0, 0.25);
        }
        50% {
          transform: translateY(-5px) scale(1.08) translateZ(0);
          box-shadow: 0 0 14px rgba(0, 217, 255, 0.95), 0 0 6px rgba(37, 137, 255, 0.85), 0 4px 8px rgba(0, 0, 0, 0.3);
        }
      }

      .animate-cart-badge {
        display: flex !important;
        align-items: center;
        justify-content: center;
        transform-origin: center bottom !important;
        animation: cart-badge-bounce 1.3s ease-in-out infinite !important;
        will-change: transform, box-shadow;
      }

      /* Backward compatibility aliases */
      .animate-cart-running {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        transform-origin: center bottom !important;
        animation: cart-rocking 1.8s ease-in-out infinite !important;
        will-change: transform, filter;
      }
      .animate-cart-running svg circle {
        transform-box: fill-box;
        transform-origin: center center;
        animation: cart-wheel-spin 1.8s ease-in-out infinite;
      }
      .animate-badge-bounce {
        display: flex !important;
        align-items: center;
        justify-content: center;
        transform-origin: center bottom !important;
        animation: wishlist-badge-bounce 1.4s ease-in-out infinite !important;
        will-change: transform, box-shadow;
      }
      .animate-badge-bounce-offset {
        display: flex !important;
        align-items: center;
        justify-content: center;
        transform-origin: center bottom !important;
        animation: cart-badge-bounce 1.3s ease-in-out infinite !important;
        will-change: transform, box-shadow;
      }

      @media (prefers-reduced-motion: reduce) {
        .glow-card, .glow-panel, .glow-featured, .glow-subtle, .glow-interactive, .glow-btn-primary {
          transition: none !important;
          transform: none !important;
        }
        .animate-wishlist-heart,
        .animate-wishlist-badge,
        .animate-cart-rocking,
        .animate-cart-badge {
          animation: none !important;
          transform: none !important;
          filter: none !important;
          box-shadow: none !important;
        }
      }
    </style>
